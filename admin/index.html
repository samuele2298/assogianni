<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Admin Eventi | Asso Gianni</title>

    <script>
        // When opened as /admin (without trailing slash), relative assets resolve to root and 404.
        if (window.location.pathname === "/admin") {
            window.location.replace("/admin/" + window.location.search + window.location.hash);
        }
    </script>

    <link href="../img/favicon.ico" rel="icon">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="admin.css" rel="stylesheet">
</head>

<body>
    <main class="admin-shell container py-4 py-md-5">
        <section id="login-card" class="admin-card mx-auto">
            <h1 class="h3 mb-3">Area Admin Eventi</h1>
            <p class="text-muted mb-4">Inserisci la password per gestire i prossimi eventi.</p>
            <p class="text-muted small mb-3">Se apri i file con doppio click, funziona in modalita locale. Per avere URL /admin e salvataggio JSON reale serve avviare il sito con server PHP.</p>

            <form id="login-form" class="row g-3">
                <div class="col-12">
                    <label for="admin-password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="admin-password" placeholder="Password" required>
                </div>
                <div class="col-12 d-grid">
                    <button type="submit" class="btn btn-main">Entra</button>
                </div>
                <div class="col-12">
                    <p id="login-error" class="admin-error d-none mb-0"></p>
                </div>
            </form>
        </section>

        <section id="panel-card" class="admin-card d-none">
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
                <h2 class="h4 mb-0">Prossimi Eventi</h2>
                <button id="logout-btn" class="btn btn-outline-secondary btn-sm">Esci</button>
            </div>

            <form id="event-form" class="row g-3 mb-4">
                <input type="hidden" id="event-id">
                <div class="col-12 col-lg-4">
                    <label for="event-title" class="form-label">Titolo evento</label>
                    <input type="text" class="form-control" id="event-title" placeholder="Es. Serata di Magia" required>
                </div>
                <div class="col-12 col-lg-4">
                    <label for="event-location" class="form-label">Luogo</label>
                    <input type="text" class="form-control" id="event-location" placeholder="Es. Mantova" required>
                </div>
                <div class="col-12 col-lg-4">
                    <label for="event-datetime" class="form-label">Data e ora</label>
                    <input type="datetime-local" class="form-control" id="event-datetime" required>
                </div>
                <div class="col-12 d-flex flex-wrap gap-2">
                    <button type="submit" class="btn btn-main" id="save-btn">Aggiungi evento</button>
                    <button type="button" class="btn btn-outline-secondary d-none" id="cancel-edit-btn">Annulla modifica</button>
                </div>
            </form>

            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>Titolo</th>
                            <th>Luogo</th>
                            <th>Data e ora</th>
                            <th class="text-end">Azioni</th>
                        </tr>
                    </thead>
                    <tbody id="events-table-body"></tbody>
                </table>
            </div>

            <p id="events-empty" class="text-muted mb-0 d-none">Nessun evento presente.</p>
            <p id="panel-message" class="admin-message mt-3 mb-0 d-none"></p>
        </section>
    </main>

    <script src="admin.js"></script>
</body>

</html>
